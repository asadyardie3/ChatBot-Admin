<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>User Admin Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app">
    <header>
      <span>User Admin Chatbot</span>
      <span>{{ email }} &middot; <a href="/logout">Logout</a></span>
    </header>
    <div id="messages"></div>
    <form id="form">
      <input id="input" autocomplete="off" placeholder='e.g. add the user "john@xyz.com" with phone number "+92332"'>
      <button type="submit">Send</button>
    </form>
  </div>
  <script>
    const box = document.getElementById('messages');
    function add(text, who) {
      const d = document.createElement('div');
      d.className = 'msg ' + who;
      d.textContent = text;
      box.appendChild(d);
      box.scrollTop = box.scrollHeight;
    }
    add('Hi! I can add, remove, update and list users. Type "help" for examples.', 'bot');
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('input');
      const m = input.value.trim();
      if (!m) return;
      add(m, 'user');
      input.value = '';
      try {
        const r = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message: m})
        });
        if (r.status === 401) { window.location = '/login'; return; }
        const j = await r.json();
        add(j.reply, 'bot');
      } catch (err) {
        add('Network error. Please try again.', 'bot');
      }
    });
  </script>
</body>
</html>
